<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Help - Sistema de Tickets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-headset"></i> IT Help · Sistema de Tickets
      </span>
      <span class="badge bg-danger" id="urgentCounter">
        <i class="bi bi-exclamation-triangle-fill"></i> 0 urgentes
      </span>
    </div>
  </nav>

  <main class="container my-4">

    <!-- FORMULARIO -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <i class="bi bi-pencil-square"></i> Nuevo Ticket
      </div>
      <div class="card-body">
        <form id="ticketForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required>
              <div class="invalid-feedback">Mínimo 3 caracteres.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
              <div class="invalid-feedback">Email con formato válido.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Prioridad</label>
              <select class="form-select" id="prioridad">
                <option value="baja">Baja</option>
                <option value="normal" selected>Normal</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" id="mensaje" rows="3" required></textarea>
              <div class="invalid-feedback">Mínimo 10 caracteres.</div>
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send"></i> Publicar Ticket
            </button>
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-x-circle"></i> Limpiar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <label class="form-label mb-1 small fw-bold">Filtrar por prioridad</label>
            <select class="form-select form-select-sm" id="filterPriority">
              <option value="all">Todas</option>
              <option value="alta">Alta</option>
              <option value="normal">Normal</option>
              <option value="baja">Baja</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label mb-1 small fw-bold">Buscar texto</label>
            <input type="text" class="form-control form-control-sm" id="searchText" placeholder="Buscar en mensajes...">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-sm btn-outline-danger w-100" id="clearAll">
              <i class="bi bi-trash"></i> Borrar todos
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- LISTA DE TICKETS -->
    <h5 class="mb-3">
      <i class="bi bi-list-ul"></i> Lista de Tickets 
      <span class="badge bg-secondary" id="totalCounter">0</span>
    </h5>
    <div id="ticketList" class="row g-3"></div>

  </main>

  <footer class="text-center text-muted py-4">
    <small>&copy; 2025 IT Help · Demo SPA con Bootstrap + localStorage</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
